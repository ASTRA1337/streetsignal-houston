
[project]
name = "streetsignal-houston"
version = "0.0.1"
description = "An open-source street-safety evidence and intervention intelligence system for Houston, Texas."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"

dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["streetsignal*"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]